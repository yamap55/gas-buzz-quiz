<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<style>
  :root {
    --bg: #10131a;
    --panel: #1b2130;
    --panel-2: #232b3d;
    --gold: #f5c451;
    --gold-dim: #8a6d24;
    --text: #f2f4f8;
    --muted: #9aa4b8;
    --ok: #4ade80;
    --ok-ink: #04260f;
    --ng: #f87171;
    --ng-bg: #4a1d1d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  }

  /* 画面全体を縦に使い切る。スマホのアドレスバーを考慮して dvh を優先する */
  #app {
    height: 100vh;
    height: 100dvh;
    max-width: 640px;
    margin: 0 auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .screen { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .center { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 16px; }
  .muted { color: var(--muted); font-size: 14px; }
  .big { font-size: 28px; font-weight: 700; }

  /* 状況を伝える帯。回答済み・時間切れ・正解発表で文言と色が変わる */
  .banner { flex: 0 0 auto; text-align: center; font-size: 18px; font-weight: 800; padding: 8px; border-radius: 10px; }
  .banner.info { background: var(--panel-2); color: var(--muted); }
  .banner.ok { background: var(--ok); color: var(--ok-ink); }
  .banner.ng { background: var(--ng); color: #2a0606; }

  /* 問題文。「Q」のバッジは残すが、選択肢側の「A」の列は横幅を食うため置かない */
  .qblock { flex: 0 0 auto; display: flex; gap: 10px; align-items: flex-start; background: var(--panel); border-radius: 12px; padding: 12px; }
  .badge {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--gold);
    color: #1a1200;
    font-weight: 800; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .qtext { font-size: 18px; font-weight: 600; line-height: 1.45; padding-top: 4px; }

  /* 選択肢は残りの高さを均等に分け合う。押しやすさと縦幅の消化を兼ねる */
  .choices { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .choice {
    flex: 1 1 0; min-height: 54px;
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: var(--panel-2); color: var(--text);
    border: 2px solid transparent; border-radius: 12px;
    padding: 10px 14px; font-size: 17px; font-family: inherit;
    cursor: pointer;
  }
  .choice[disabled] { cursor: default; }
  .choice:not([disabled]):active { background: var(--gold-dim); }
  .choice .num {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 6px;
    background: var(--gold); color: #1a1200;
    font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .choice .mark {
    margin-left: auto; flex: 0 0 auto;
    font-size: 12px; font-weight: 700;
    background: var(--gold); color: #1a1200;
    padding: 3px 10px; border-radius: 999px;
  }
  .choice.mine { border-color: var(--gold); }
  .choice.wrong { background: var(--ng-bg); border-color: var(--ng); }

  /* 正解の行は塗りつぶしたうえで数回点滅させる */
  .choice.correct { background: var(--ok); color: var(--ok-ink); border-color: var(--ok); animation: blinkFill 0.4s steps(1, end) 5; }
  @keyframes blinkFill {
    0%, 49% { background: var(--ok); color: var(--ok-ink); }
    50%, 100% { background: var(--panel-2); color: var(--text); }
  }

  .grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
  .imgchoice { position: relative; padding: 0; border: 3px solid transparent; border-radius: 12px; overflow: hidden; background: var(--panel-2); cursor: pointer; }
  .imgchoice[disabled] { cursor: default; }
  .imgchoice img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .imgchoice .num { position: absolute; top: 6px; left: 6px; width: 26px; height: 26px; border-radius: 6px; background: var(--gold); color: #1a1200; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .imgchoice .mark { position: absolute; bottom: 6px; right: 6px; font-size: 12px; font-weight: 700; background: var(--gold); color: #1a1200; padding: 3px 10px; border-radius: 999px; }
  .imgchoice.mine { border-color: var(--gold); }
  .imgchoice.wrong { border-color: var(--ng); }
  .imgchoice.correct { border-color: var(--ok); animation: blinkBorder 0.4s steps(1, end) 5; }
  @keyframes blinkBorder {
    0%, 49% { border-color: var(--ok); }
    50%, 100% { border-color: transparent; }
  }

  .timerwrap { flex: 0 0 auto; }
  .timerbar { height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; }
  .timerfill { height: 100%; background: var(--gold); transition: width 0.1s linear; }
  .timertext { text-align: right; font-size: 14px; color: var(--muted); margin-top: 4px; }

  input[type=text] {
    width: 100%; padding: 14px; font-size: 17px; font-family: inherit;
    border-radius: 10px; border: 1px solid #3a4459;
    background: var(--panel-2); color: var(--text);
  }
  button.primary {
    width: 100%; padding: 14px; font-size: 17px; font-weight: 700; font-family: inherit;
    border: none; border-radius: 10px; background: var(--gold); color: #1a1200; cursor: pointer;
  }
  .count { font-size: 96px; font-weight: 800; color: var(--gold); line-height: 1; }
  .warn { flex: 0 0 auto; color: var(--ng); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>

<script>
  var POLL_INTERVAL_MS = 2500;
  var TICK_INTERVAL_MS = 100;

  var st = {
    name: '',
    state: null,
    offset: 0,        // サーバー時刻 - ローカル時刻
    bestRtt: Infinity,
    lastKey: '',
    sendFailed: false,
  };

  /* ---- localStorage（回答の二重送信防止と再訪時の復帰に使う） ---- */

  function ls(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function lsSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* 無視 */ } }

  // 出題のたびに startAt が変わるため、キーに含めることで再出題時に前回の回答が残らない
  function answerKey(s) { return 'quiz.ans.' + s.question.id + '.' + s.startAt; }

  function myAnswer(s) {
    var v = ls(answerKey(s));
    return v ? Number(v) : 0;
  }

  /* ---- 時刻同期 ---- */

  // 往復時間が最小だったサンプルのオフセットを採用する
  function now() { return Date.now() + st.offset; }

  function poll() {
    var t0 = Date.now();
    google.script.run
      .withSuccessHandler(function (s) {
        var t1 = Date.now();
        var rtt = t1 - t0;
        if (rtt < st.bestRtt) {
          st.bestRtt = rtt;
          st.offset = s.serverNow - (t0 + t1) / 2;
        }
        st.state = s;
      })
      .withFailureHandler(function () { /* 次のポーリングで回復するので何もしない */ })
      .getState();
  }

  /* ---- 画面の決定 ---- */

  /**
   * 回答後も問題の画面を出したままにする。
   * 何の問題にどう答えたかが分からなくなるのを避けるため、
   * 回答済み・時間切れ・正解発表はいずれも同じ画面の状態違いとして扱う。
   */
  function currentView() {
    if (!st.name) return { screen: 'name' };
    var s = st.state;
    if (!s) return { screen: 'loading' };
    if (s.phase === 'waiting' || !s.question) return { screen: 'waiting' };

    var q = s.question;
    var mine = myAnswer(s);
    if (s.phase === 'answer') return { screen: 'question', mode: 'result', q: q, mine: mine, correct: s.correct };
    if (now() < s.startAt) return { screen: 'countdown', q: q };
    if (mine) return { screen: 'question', mode: 'answered', q: q, mine: mine };
    if (now() - s.startAt > q.limitSec * 1000) return { screen: 'question', mode: 'closed', q: q };
    return { screen: 'question', mode: 'open', q: q };
  }

  function viewKey(v) {
    return [v.screen, v.mode || '', v.q ? v.q.id : '', v.mine || '', st.sendFailed ? 'e' : ''].join('|');
  }

  /* ---- 描画 ---- */

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function bannerHtml(v) {
    if (v.mode === 'answered') return '<div class="banner info">回答しました</div>';
    if (v.mode === 'closed') return '<div class="banner info">時間切れ</div>';
    if (v.mode !== 'result') return '';
    if (!v.mine) return '<div class="banner ng">未回答</div>';
    return v.mine === v.correct
      ? '<div class="banner ok">正解</div>'
      : '<div class="banner ng">不正解</div>';
  }

  function questionHtml(q, opts) {
    var html = '<div class="qblock"><div class="badge">Q</div><div class="qtext">' + esc(q.text) + '</div></div>';

    if (q.type === 'image') {
      html += '<div class="grid">';
      for (var i = 1; i <= 4; i++) {
        html += '<button class="imgchoice ' + choiceClass(i, opts) + '" ' + choiceAttr(i, opts) + '>'
          + '<span class="num">' + i + '</span>'
          + '<img src="' + esc(q.choices[i - 1]) + '" alt="">'
          + markHtml(i, opts)
          + '</button>';
      }
      html += '</div>';
    } else {
      html += '<div class="choices">';
      for (var j = 1; j <= 4; j++) {
        html += '<button class="choice ' + choiceClass(j, opts) + '" ' + choiceAttr(j, opts) + '>'
          + '<span class="num">' + j + '</span><span>' + esc(q.choices[j - 1]) + '</span>'
          + markHtml(j, opts)
          + '</button>';
      }
      html += '</div>';
    }
    return html;
  }

  function choiceClass(n, opts) {
    var cls = [];
    if (opts.correct === n) cls.push('correct');
    if (opts.mine === n) {
      cls.push('mine');
      if (opts.correct && opts.correct !== n) cls.push('wrong');
    }
    return cls.join(' ');
  }

  function choiceAttr(n, opts) {
    return opts.selectable ? 'onclick="submit(' + n + ')"' : 'disabled';
  }

  function markHtml(n, opts) {
    return opts.mine === n ? '<span class="mark">あなたの回答</span>' : '';
  }

  function timerHtml() {
    return '<div class="timerwrap">'
      + '<div class="timerbar"><div class="timerfill" id="timerfill"></div></div>'
      + '<div class="timertext" id="timertext"></div>'
      + '</div>';
  }

  function render(force) {
    var v = currentView();
    var key = viewKey(v);
    if (!force && key === st.lastKey) { tickTimer(v); return; }
    st.lastKey = key;

    var app = document.getElementById('app');
    var html = '';

    switch (v.screen) {
      case 'name':
        html = '<div class="center">'
          + '<div class="big">早押しクイズ大会</div>'
          + '<div class="muted">名前を入力してください</div>'
          + '<input type="text" id="nameInput" placeholder="山田太郎" autocomplete="off">'
          + '<button class="primary" onclick="register()">参加する</button>'
          + '</div>';
        break;

      case 'loading':
        html = '<div class="center"><div class="muted">接続中...</div></div>';
        break;

      case 'waiting':
        html = '<div class="center">'
          + '<div class="big">準備中</div>'
          + '<div class="muted">' + esc(st.name) + ' さんで参加中<br>次の問題をお待ちください</div>'
          + '</div>';
        break;

      case 'countdown':
        html = '<div class="center">'
          + '<div class="muted">まもなく出題</div>'
          + '<div class="count" id="countnum">-</div>'
          + '</div>';
        break;

      case 'question':
        html = '<div class="screen">'
          + bannerHtml(v)
          + questionHtml(v.q, {
              selectable: v.mode === 'open',
              mine: v.mine,
              correct: v.mode === 'result' ? v.correct : 0,
            })
          + (v.mode === 'result' ? '' : timerHtml())
          + (st.sendFailed ? '<div class="warn">送信に失敗しました。司会者に申し出てください</div>' : '')
          + '</div>';
        break;
    }

    app.innerHTML = html;

    if (v.screen === 'name') {
      var input = document.getElementById('nameInput');
      input.value = ls('quiz.name') || '';
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') register(); });
    }
    tickTimer(v);
  }

  // 残り時間・カウントダウンだけを毎tick更新する（画面全体は再描画しない）
  function tickTimer(v) {
    var s = st.state;
    if (!s || !s.question) return;

    if (v.screen === 'countdown') {
      var el = document.getElementById('countnum');
      if (el) el.textContent = Math.max(0, Math.ceil((s.startAt - now()) / 1000));
      return;
    }
    if (v.screen !== 'question' || v.mode === 'result') return;

    var limitMs = v.q.limitSec * 1000;
    var remain = Math.max(0, limitMs - (now() - s.startAt));
    var fill = document.getElementById('timerfill');
    var text = document.getElementById('timertext');
    if (fill) fill.style.width = (remain / limitMs * 100) + '%';
    if (text) text.textContent = '残り ' + (remain / 1000).toFixed(1) + ' 秒';
  }

  /* ---- 操作 ---- */

  function register() {
    var name = document.getElementById('nameInput').value.trim();
    if (!name) return;
    st.name = name;
    lsSet('quiz.name', name);
    google.script.run.registerParticipant(name);
    render(true);
  }

  function submit(choice) {
    var s = st.state;
    if (!s || !s.question) return;
    var q = s.question;
    if (myAnswer(s)) return;

    // 押した瞬間の時刻で経過時間を確定させ、先に画面を切り替える
    var elapsedMs = now() - s.startAt;
    lsSet(answerKey(s), String(choice));
    st.sendFailed = false;
    render(true);

    google.script.run
      .withSuccessHandler(function () {})
      .withFailureHandler(function () { st.sendFailed = true; render(true); })
      .submitAnswer({ questionId: q.id, name: st.name, choice: choice, elapsedMs: elapsedMs });
  }

  /* ---- 起動 ---- */

  st.name = ls('quiz.name') || '';
  render(true);
  poll();
  setInterval(poll, POLL_INTERVAL_MS);
  setInterval(function () { render(false); }, TICK_INTERVAL_MS);
</script>
</body>
</html>
