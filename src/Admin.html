<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<style>
  :root {
    --bg: #10131a;
    --panel: #1b2130;
    --panel-2: #232b3d;
    --gold: #f5c451;
    --text: #f2f4f8;
    --muted: #9aa4b8;
    --ng: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }

  .status { background: var(--panel); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .statusrow { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 12px; }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-size: 22px; font-weight: 700; }
  .value.gold { color: var(--gold); }
  .qnow { font-size: 15px; color: var(--muted); margin-bottom: 12px; }
  /* 正解発表のときに司会が読み上げる補足。問題シートの備考列 */
  .note { font-size: 14px; line-height: 1.6; background: var(--panel-2); border-left: 3px solid var(--gold); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; white-space: pre-wrap; }
  .error { color: var(--ng); font-size: 13px; margin-bottom: 12px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    padding: 10px 18px; font-size: 15px; font-weight: 700; font-family: inherit;
    border: none; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  .btn-gold { background: var(--gold); color: #1a1200; }
  .btn-sub { background: var(--panel-2); color: var(--text); }
  .btn-start { background: var(--panel-2); color: var(--gold); border: 1px solid var(--gold); padding: 6px 14px; font-size: 14px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; font-size: 14px; border-bottom: 1px solid #2b344a; }
  th { background: var(--panel-2); color: var(--muted); font-size: 12px; }
  tr.active td { background: #2a3150; }
  td.text { max-width: 420px; }
  .nowrap { white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>クイズ大会 管理画面</h1>

  <!--
    ボタンを含む要素は作り直さず、値の書き換えだけで更新する。
    100msごとに innerHTML で組み立て直すと、mousedown と mouseup の間に
    ボタンのDOMが消えてクリックが成立しなくなるため。
  -->
  <div class="status">
    <div class="statusrow">
      <div class="stat"><div class="label">状態</div><div class="value gold" id="v-phase">-</div></div>
      <div class="stat"><div class="label">参加者</div><div class="value" id="v-participants">-</div></div>
      <div class="stat"><div class="label">この問題の回答</div><div class="value" id="v-answers">-</div></div>
      <div class="stat"><div class="label">タイマー</div><div class="value" id="v-timer">-</div></div>
    </div>
    <div class="qnow" id="v-question">読み込み中...</div>
    <div class="note" id="v-note" hidden></div>
    <div class="error" id="v-error"></div>
    <div class="actions">
      <button class="btn-gold" id="btn-reveal" disabled>正解発表</button>
      <button class="btn-sub" id="btn-waiting" disabled>待機に戻す</button>
    </div>
  </div>

  <div id="questions"></div>
</div>

<script>
  var POLL_INTERVAL_MS = 2500;
  var TICK_INTERVAL_MS = 100;
  var PHASE_LABEL = { waiting: '待機中', question: '出題中', answer: '正解発表中' };

  var st = { data: null, offset: 0, bestRtt: Infinity, busy: false, tableKey: '' };

  function now() { return Date.now() + st.offset; }

  function poll() {
    var t0 = Date.now();
    google.script.run
      .withSuccessHandler(function (d) {
        var t1 = Date.now();
        if (t1 - t0 < st.bestRtt) {
          st.bestRtt = t1 - t0;
          st.offset = d.serverNow - (t0 + t1) / 2;
        }
        st.data = d;
        setText('v-error', '');
        render();
      })
      .withFailureHandler(function (e) { setText('v-error', '通信エラー: ' + e.message); })
      .adminGetDashboard();
  }

  /* ---- 描画 ---- */

  function setText(id, value) {
    var el = document.getElementById(id);
    if (el && el.textContent !== value) el.textContent = value;
  }

  function render() {
    var d = st.data;
    if (!d) return;
    var s = d.state;
    var q = s.question;

    setText('v-phase', PHASE_LABEL[s.phase] || s.phase);
    setText('v-participants', d.participantCount + ' 人');
    setText('v-answers', d.answerCount + ' 件');
    setText('v-timer', timerText(s, q));
    setText('v-question', q ? q.id + ' : ' + q.text : '問題は選択されていません');

    var note = q ? noteOf(d, q.id) : '';
    var noteEl = document.getElementById('v-note');
    setText('v-note', note);
    noteEl.hidden = !note;

    document.getElementById('btn-reveal').disabled = st.busy || !q || s.phase !== 'question';
    document.getElementById('btn-waiting').disabled = st.busy;

    renderTable(d);
  }

  function noteOf(d, questionId) {
    var matched = d.questions.filter(function (q) { return q.id === questionId; });
    return matched.length ? (matched[0].note || '') : '';
  }

  function timerText(s, q) {
    if (!q || s.phase !== 'question') return '-';
    var toStart = s.startAt - now();
    if (toStart > 0) return '表示まで ' + Math.ceil(toStart / 1000) + ' 秒';
    var remain = Math.max(0, q.limitSec * 1000 - (now() - s.startAt));
    return '残り ' + (remain / 1000).toFixed(1) + ' 秒';
  }

  // 問題一覧は内容が変わったときだけ組み立て、それ以外は状態の反映だけ行う
  function renderTable(d) {
    var key = d.questions.map(function (q) { return q.id; }).join(',');
    if (key !== st.tableKey) {
      st.tableKey = key;
      buildTable(d.questions);
    }
    var activeId = d.state.question ? d.state.question.id : '';
    var rows = document.querySelectorAll('#questions tr[data-id]');
    Array.prototype.forEach.call(rows, function (tr) {
      tr.classList.toggle('active', tr.getAttribute('data-id') === activeId);
      tr.querySelector('button').disabled = st.busy;
    });
  }

  function buildTable(questions) {
    var table = document.createElement('table');
    table.appendChild(buildRow('th', ['ID', '問題', '種別', '制限', '']));

    questions.forEach(function (q) {
      var tr = buildRow('td', [q.id, q.text, q.type, q.limitSec + '秒', '']);
      tr.setAttribute('data-id', q.id);
      tr.children[1].className = 'text';

      var button = document.createElement('button');
      button.className = 'btn-start';
      button.textContent = '出題';
      button.addEventListener('click', function () { start(q.id); });
      tr.children[4].appendChild(button);

      table.appendChild(tr);
    });

    var host = document.getElementById('questions');
    host.innerHTML = '';
    host.appendChild(table);
  }

  function buildRow(tag, values) {
    var tr = document.createElement('tr');
    values.forEach(function (value) {
      var cell = document.createElement(tag);
      cell.className = 'nowrap';
      cell.textContent = value;
      tr.appendChild(cell);
    });
    return tr;
  }

  /* ---- 操作 ---- */

  function command(fn, arg) {
    if (st.busy) return;
    st.busy = true;
    render();
    var runner = google.script.run
      .withSuccessHandler(function (d) { st.busy = false; st.data = d; render(); })
      .withFailureHandler(function (e) { st.busy = false; setText('v-error', e.message); render(); });
    if (arg === undefined) runner[fn](); else runner[fn](arg);
  }

  function start(id) {
    if (st.data && st.data.state.phase === 'question' && !confirm('出題中です。切り替えますか？')) return;
    command('adminStartQuestion', id);
  }

  /* ---- 起動 ---- */

  document.getElementById('btn-reveal').addEventListener('click', function () { command('adminRevealAnswer'); });
  document.getElementById('btn-waiting').addEventListener('click', function () { command('adminSetWaiting'); });

  poll();
  setInterval(poll, POLL_INTERVAL_MS);
  setInterval(render, TICK_INTERVAL_MS);
</script>
</body>
</html>
